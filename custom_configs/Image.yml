# --------------------------------------
# Image Settings
# --------------------------------------

favicon: /img/favicon.webp

avatar:
  img: /img/avatar.webp
  effect: false

# Disable all banner image
disable_top_img: false

# The banner image of home page
index_img: '/img/index.webp'

# If the banner of page not setting, it will show the top_img
default_top_img: '/img/index.webp'





# The banner image of archive page
archive_img:

# Note: tag page, not tags page
tag_img:

# The banner image of tag page, you can set the banner image for each tag
# Format:
#  - tag name: xxxxx
tag_per_img:

# Note: category page, not categories page
category_img:

# The banner image of category page, you can set the banner image for each category
# Format:
#  - category name: xxxxx
category_per_img:

# The background image of footer
footer_img: false

# Website Background
# Can set it to color or image url
background: /img/background.webp

cover:
  # Disable the cover or not
  index_enable: true
  aside_enable: true
  archives_enable: true
  # When cover is not set, the default cover is displayed
  default_cover:
    # - xxx.jpg




# Replace Broken Images
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

# A simple 404 page
error_404:
  enable: true
  subtitle: '這个頁面在睡大覺ZzzZzz'
  background: https://i.loli.net/2020/05/19/aKOcLiyPl2JQdFD.png



post_meta:
  page: # 主頁是否顯示
    date_type: both       # created or updated or both 主頁文章日期是創建日或者更新日或都顯示
    date_format: date     # date/relative 顯示日期還是相對日期
    categories: true 
    tags: true 
    label: true 
  post: # 文章頁是否顯示
    position: left        # Choose: left / center
    date_type: both       # created or updated or both 文章頁日期是創建日或者更新日或都顯示
    date_format: date     # date/relative 顯示日期還是相對日期
    categories: true 
    tags: true 
    label: true 